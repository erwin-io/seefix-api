# Applies db/migrations/*.sql to the Neon preview/demo database on every push to main (policy: db/README.md).
# Never resets: that is reset-neon-db.yml. Environment `neon-preview` (no reviewers) holds NEON_DATABASE_URL.
name: Deploy Neon database
on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'scripts/database/**'
      - '.github/workflows/deploy-neon-db.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-db
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: neon-preview
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      MIGRATE_EXPECTED_HOST: ${{ vars.NEON_EXPECTED_HOST }}
      MIGRATE_EXPECTED_DATABASE: ${{ vars.NEON_EXPECTED_DATABASE }}
      MIGRATE_ENVIRONMENT: Neon preview/demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret NEON_DATABASE_URL is not set in environment neon-preview (see db/README.md)."
            exit 1
          fi
      # The runner verifies host + current_database() against NEON_EXPECTED_* before it changes anything.
      - name: Run migrations
        run: node scripts/database/migrate.js
